[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = ".next"
  functions = "netlify/functions"

[functions]
  included_files = [
    "config.py",
    "models.py",
    "github_service.py",
    "linkedin_service.py"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[plugins]]
  package = "@netlify/plugin-nextjs"
